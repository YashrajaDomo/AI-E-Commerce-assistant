services:
  backend:
    build:
      context: ./backend
    container_name: ai-shop-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./ecommerce.db
      OPENAI_API_KEY: ""
      AI_MODEL: gpt-4o-mini
      FRONTEND_URL: http://localhost:5173
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ai-shop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
