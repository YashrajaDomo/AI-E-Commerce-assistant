apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-shop-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: CATALOG_DB_USER
              value: catalog_user
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-shop-secrets
                  key: CATALOG_DB_PASSWORD
            - name: CART_DB_USER
              value: cart_user
            - name: CART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-shop-secrets
                  key: CART_DB_PASSWORD
            - name: ORDERS_DB_USER
              value: orders_user
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-shop-secrets
                  key: ORDERS_DB_PASSWORD
            - name: PAYMENTS_DB_USER
              value: payments_user
            - name: PAYMENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-shop-secrets
                  key: PAYMENTS_DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d/01-databases.sh
              subPath: 01-databases.sh
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --protocol=tcp
                - -h
                - 127.0.0.1
                - --silent
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --protocol=tcp
                - -h
                - 127.0.0.1
                - --silent
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: mysql-init
          configMap:
            name: ai-shop-mysql-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-shop-mysql-init
data:
  01-databases.sh: |
    #!/bin/sh
    set -eu
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<EOSQL
    CREATE DATABASE IF NOT EXISTS catalog_db;
    CREATE DATABASE IF NOT EXISTS cart_db;
    CREATE DATABASE IF NOT EXISTS orders_db;
    CREATE DATABASE IF NOT EXISTS payments_db;
    CREATE USER IF NOT EXISTS '${CATALOG_DB_USER}'@'%' IDENTIFIED BY '${CATALOG_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${CART_DB_USER}'@'%' IDENTIFIED BY '${CART_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${ORDERS_DB_USER}'@'%' IDENTIFIED BY '${ORDERS_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${PAYMENTS_DB_USER}'@'%' IDENTIFIED BY '${PAYMENTS_DB_PASSWORD}';
    GRANT ALL PRIVILEGES ON catalog_db.* TO '${CATALOG_DB_USER}'@'%';
    GRANT ALL PRIVILEGES ON cart_db.* TO '${CART_DB_USER}'@'%';
    GRANT ALL PRIVILEGES ON orders_db.* TO '${ORDERS_DB_USER}'@'%';
    GRANT ALL PRIVILEGES ON payments_db.* TO '${PAYMENTS_DB_USER}'@'%';
    FLUSH PRIVILEGES;
    EOSQL
